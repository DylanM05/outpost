server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;

    location / {
        try_files $uri /index.html;
    }

    # Hashed build output never changes in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The relay terminal's Linux machine. Everything but the manifest is named
    # by its contents, so only the manifest needs checking for updates.
    location /vm/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /vm/manifest.json {
        add_header Cache-Control "no-cache";
    }

    # The Python runtime. Workers refuse to import modules served with the
    # wrong type, so set them explicitly.
    location /pyodide/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/json json;
            application/zip zip;
        }
        add_header Cache-Control "public, max-age=604800";
    }
}
